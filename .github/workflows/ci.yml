name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile all programs
        run: javac -Xlint:all -d out Projects/src/*.java
      - name: Smoke-test programs with sample input
        run: bash smoke-test.sh out
